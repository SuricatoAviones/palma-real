packages:
  - backend
  - frontend

allowBuilds:
  bcrypt: true
  unrs-resolver: true

# Catálogo central de versiones (pnpm catalogs):
# versiones únicas compartidas por todos los workspaces.
catalog:
  # --- backend ---
  express: ^5.2.1
  mongoose: ^9.9.2
  bcrypt: ^6.0.0
  cors: ^2.8.6
  dotenv: ^17.4.2
  jsonwebtoken: ^9.0.3
  nodemailer: ^9.0.5
  jest: ^30.4.2
  nodemon: ^3.1.14

  # --- frontend: runtime ---
  react: ^19.2.8
  react-dom: ^19.2.8
  react-redux: ^9.3.0
  react-router-dom: ^7.18.2
  redux: ^5.0.1
  redux-thunk: ^3.1.0
  '@reduxjs/toolkit': ^2.12.0
  axios: ^1.19.0
  react-hook-form: ^7.85.0
  sweetalert2: ^11.26.25
  react-csv: ^2.2.2
  '@mui/material': ^9.3.1
  '@mui/icons-material': ^9.3.1
  '@mui/styled-engine-sc': ^9.3.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  styled-components: ^6.5.2

  # --- frontend: dev ---
  vite: ^8.2.1
  '@vitejs/plugin-react': ^6.0.5
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  eslint: ^9.39.5
  '@eslint/js': ^9.39.5
  globals: ^17.10.0
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.4
  prettier: ^3.9.6
  prettier-plugin-tailwindcss: ^0.8.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4

minimumReleaseAgeExclude:
  - globals@17.10.0
  - styled-components@6.5.2
